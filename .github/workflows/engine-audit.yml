name: Engine Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install audit dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate source and game data
        id: data_audit
        continue-on-error: true
        run: npm run audit:data

      - name: Run core engine unit tests
        id: unit_audit
        if: always()
        continue-on-error: true
        run: npm run audit:unit

      - name: Run browser audit
        id: browser_audit
        if: always()
        continue-on-error: true
        run: npm run audit:browser

      - name: Upload browser audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-audit-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail when an audit phase failed
        if: steps.data_audit.outcome == 'failure' || steps.unit_audit.outcome == 'failure' || steps.browser_audit.outcome == 'failure'
        run: exit 1
